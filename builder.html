<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Week Builder — Meal Prep</title>
<style>
  :root{
    --paper:#f7f4ee; --card:#fffdf8; --ink:#201f1a; --muted:#6f6a5d;
    --line:#e4ded1; --line2:#efe9dd;
    --him:#46603a; --him-soft:#eaf0e3; --her:#8a4d68; --her-soft:#f3e7ee;
    --carb:#b07d2b; --ok:#3f7a3a; --warn:#b26a1f; --bad:#b23b2f;
    --num:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.4}
  .wrap{max-width:840px;margin:0 auto;padding:0 0 140px}
  header{position:sticky;top:0;z-index:30;background:var(--paper);padding:12px 16px 10px;border-bottom:1px solid var(--line)}
  .topline{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .brand{font-size:1.05rem;font-weight:700}.brand small{display:block;font-weight:500;color:var(--muted);font-size:.72rem;letter-spacing:.02em;text-transform:uppercase}
  .ctrls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ctrls .f{display:flex;align-items:center;gap:5px;font-size:.76rem;color:var(--muted)}
  #weekId{font:inherit;font-family:var(--num);font-size:.8rem;padding:6px 7px;border:1px solid var(--line);border-radius:8px;background:var(--card);width:128px}
  button{appearance:none;border:1px solid var(--line);background:var(--card);font:inherit;font-weight:600;font-size:.82rem;color:var(--ink);padding:8px 12px;border-radius:9px;cursor:pointer}
  button.primary{background:var(--him);color:#fff;border-color:var(--him)}
  button:active{transform:translateY(1px)}
  a.port{font-size:.8rem;font-weight:600;color:var(--him);text-decoration:none;border:1px solid var(--line);padding:8px 11px;border-radius:9px}
  .legend{margin:9px 16px 0;color:var(--muted);font-size:.75rem}
  .legend b{color:var(--ink)}
  .day{margin:12px 16px;border:1px solid var(--line);background:var(--card);border-radius:16px;overflow:hidden}
  .dhead{padding:11px 15px 9px;border-bottom:1px solid var(--line2)}
  .dhead h2{margin:0;font-size:1.12rem;letter-spacing:-.01em}
  .slots{padding:4px 12px 8px}
  .slot{display:grid;grid-template-columns:78px 1fr auto;gap:9px;align-items:start;padding:8px 4px;border-top:1px solid var(--line2)}
  .slot:first-child{border-top:0}
  .slot .lab{font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding-top:9px}
  select{font:inherit;font-size:.86rem;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);max-width:100%}
  .main-sel{width:100%}
  .bowl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .bowl select{font-size:.8rem;padding:6px 7px}
  .bowl .sv{display:flex;flex-direction:column;gap:2px}
  .bowl .sv span{font-size:.6rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
  .slot .mk{font-family:var(--num);font-size:.72rem;color:var(--muted);white-space:nowrap;text-align:right;min-width:108px;padding-top:9px}
  .slot .mk b{color:var(--him);font-weight:600}.slot .mk i{color:var(--her);font-style:normal;font-weight:600}
  .slot .mk em{color:var(--carb);font-style:normal}
  .combtn{margin-top:6px}.combtn button{font-size:.72rem;padding:5px 9px}
  .shakerow{display:flex;align-items:center;gap:12px;padding:8px 6px 2px;border-top:1px solid var(--line2);font-size:.78rem;color:var(--muted)}
  .shakerow input{font:inherit;font-family:var(--num);width:48px;padding:5px 6px;border:1px solid var(--line);border-radius:7px;background:var(--paper);text-align:center}
  .summary{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line2);border-top:1px solid var(--line2)}
  .per{background:var(--card);padding:10px 14px}
  .per .who{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:3px}
  .per.him .who{color:var(--him)} .per.her .who{color:var(--her)}
  .per .kc{font-family:var(--num);font-size:1.05rem;font-weight:600}
  .per .kc span{font-family:var(--sans);font-size:.7rem;color:var(--muted);font-weight:500;margin-left:5px}
  .per .row2{display:flex;gap:7px;align-items:center;margin-top:5px;flex-wrap:wrap}
  .chip{font-size:.7rem;font-weight:600;padding:3px 8px;border-radius:999px;font-family:var(--num)}
  .chip.ok{background:#e7f1e5;color:var(--ok)}.chip.warn{background:#f6ecdb;color:var(--warn)}.chip.bad{background:#f6e0dd;color:var(--bad)}
  .chip.carb{background:#f3ead9;color:var(--carb)}
  .panel{margin:16px;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:14px}
  .panel h3{margin:0 0 8px;font-size:.95rem}
  .panel .close{float:right;font-size:.74rem;padding:5px 9px}
  .frm{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:8px}
  .frm label{display:flex;flex-direction:column;gap:3px;font-size:.66rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
  .frm input[type=text]{font:inherit;font-size:.86rem;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);width:200px}
  .rrow{display:flex;gap:6px;align-items:center;margin-bottom:5px}
  .rrow input[type=number]{font:inherit;font-family:var(--num);width:64px;padding:6px;border:1px solid var(--line);border-radius:7px;background:var(--paper);text-align:right}
  .rrow .g{font-size:.7rem;color:var(--muted)}
  table.tb{width:100%;border-collapse:collapse;font-size:.82rem}
  table.tb th,table.tb td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
  table.tb th{font-size:.66rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  table.tb td.n{font-family:var(--num)}
  .buy{font-family:var(--num);font-weight:600;white-space:nowrap}.asm{font-family:var(--num);font-size:.72rem;color:var(--muted)}
  textarea{width:100%;height:170px;font-family:var(--num);font-size:.72rem;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--paper);color:var(--ink);white-space:pre;overflow:auto;margin-top:8px}
  .hint{color:var(--muted);font-size:.76rem;margin-top:8px;line-height:1.5}
  .hint code{font-family:var(--num);background:var(--line2);padding:1px 5px;border-radius:4px}
  .state{padding:56px 24px;text-align:center;color:var(--muted)}
  .tag{font-size:.6rem;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);background:var(--line2);padding:2px 6px;border-radius:5px;margin-left:6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topline">
      <div class="brand">Week Builder<small>Meal Prep · weekday plan</small></div>
      <div class="ctrls">
        <span class="f">week <input id="weekId" spellcheck="false"></span>
        <a class="port" href="./manage.html">Recipes &amp; items ↗</a>
        <button id="newRecipeBtn">＋ New recipe</button>
        <button id="checkBtn">Check plan</button>
        <button id="groceryBtn">Groceries + plan</button>
        <span id="ghMount" style="display:inline-flex;gap:6px;align-items:center"></span>
        <button id="exportBtn">Export manually</button>
        <button id="reset">Reset</button>
      </div>
    </div>
    <div class="legend" id="legend">Each slot is a saved recipe or an assembled bowl auto-portioned to each split.</div>
  </header>
  <main id="main"><div class="state">Loading library…</div></main>
</div>

<script src="./gh.js"></script>
<script>
let ING=null, MEALS=null, WEEK=null, COMBOS=[], ST=null, NEWRECIPES={};
const SLOTS=["breakfast","lunch","dinner"], SLOT_LABEL={breakfast:"Breakfast",lunch:"Lunch",dinner:"Dinner"};
let ROLE={protein:[],carb:[],veg:[]};
const SEASON={ground_beef:"Asian",shrimp:"Asian",chicken_breast:"Savory",chicken_thigh:"Savory",steak:"Clean",egg:"Clean",edamame:"Asian"};
const SEASON_NOTE={Asian:"Ginger, garlic, scallion, soy, a little sesame oil.",Savory:"Salt, garlic, thyme/oregano, black pepper.",Clean:"Salt, pepper, a knob of butter."};
const SPLIT_RATIO={protein:0.6,carb:0.62,veg:1.0,fat:0.7,dairy:0.85,fruit:0.85,shake:0,extra:1.0};
const FLOOR_DEFAULT={him:180,her:100}, LB=453.592, TOL=0.06;
const floorOf=w=>{const t=ST&&ST.targets&&ST.targets[w];return t&&t.pfloor!==undefined?t.pfloor:FLOOR_DEFAULT[w];};
const GROUP_LABEL={chicken:"Chicken (thigh + breast)"};
const UNIT_WORD={lb:"lb",cup_dry:"cups dry",dozen:"dozen",bottle:"bottles",can:"can",container:"container",tub:"tub",carton:"carton",bag:"bag",gallon:"gallon",each:""};

const nutOf=(ing,amt)=>{const n=ING[ing];const k=n.basis==="100g"?amt/100:amt;return {kcal:n.kcal*k,p:n.p*k,c:n.c*k,fib:n.fib*k,f:n.f*k};};
const z=()=>({kcal:0,p:0,c:0,fib:0,f:0});
function compTotals(comps,w){const t=z();for(const cp of comps){const a=cp[w];if(a){const x=nutOf(cp.ing,a);for(const k in t)t[k]+=x[k];}}return t;}
const R=Math.round, r5=x=>Math.max(0,Math.round(x/5)*5), clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const seasonOf=pr=>SEASON[pr]||"Savory", fatFor=fam=>fam==="Asian"?"sesame_oil":"olive_oil", lprFor=(pr,fam)=>fam==="Asian"||pr==="steak";
const recipesForSlot=s=>Object.keys(MEALS).filter(id=>!id.startsWith("_")&&MEALS[id].slot===s);
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

function seed(){
  ST={weekId:WEEK.weekId,order:WEEK.weekOrder,targets:WEEK.targets,days:{}};
  for(const dk of WEEK.weekOrder){
    const wd=WEEK.days[dk], slots={};
    for(const s of SLOTS){
      const sv=wd.slots[s];
      if(!sv)slots[s]={kind:"empty"};
      else if(typeof sv==="string")slots[s]={kind:"recipe",meal:sv};
      else if(sv.components)slots[s]={kind:"recipe",meal:null,inline:sv};
      else slots[s]={kind:"recipe",meal:sv.meal};
    }
    ST.days[dk]={label:wd.label,sub:wd.sub||"",slots,shake:{...wd.shake}};
  }
}

// ---- whole-day solver -------------------------------------------------------
// A day mixes FIXED slots (saved recipes — their portions belong to the recipe)
// with FLEX slots (assembled bowls). The solver takes the day as a whole:
//   1. subtract the fixed slots + shake from the day target
//   2. split what's LEFT across the flex slots by meal share
//   3. portion each flex slot to its own share (protein → target, carb → calories)
//   4. correction passes: re-spread any residual so the DAY lands on target even
//      when an individual slot bottoms out on a clamp
const SLOT_SHARE={breakfast:0.25,lunch:0.375,dinner:0.375};
// caps are basis-aware: grams for 100g-basis foods, COUNTS for unit-basis ones
// (eggs, oils, shakes) — portioning those in "grams" is how you get 60 eggs.
const CAPS={protein:{g:[60,340],u:[1,6]},carb:{g:[0,420],u:[0,4]},veg:{g:[0,260],u:[0,3]}};
const isUnit=ing=>ING[ing].basis==="unit";
const perAmt=(ing,m)=>isUnit(ing)?ING[ing][m]:ING[ing][m]/100;   // macro per 1 unit / per 1 g
const amtFor=(ing,m,want)=>{const d=perAmt(ing,m);return d>0?want/d:0;};
const roundAmt=(ing,x)=>isUnit(ing)?Math.max(0,Math.round(x)):r5(x);
const capAmt=(ing,role,x)=>{const c=CAPS[role][isUnit(ing)?"u":"g"];return clamp(x,c[0],c[1]);};
const baseVeg=(ing,w,scale)=>roundAmt(ing,(isUnit(ing)?2:(w==="him"?150:140))*scale);

const isFlex=slot=>slot.kind==="bowl"&&!!slot.protein;
function slotFixedComps(slot){
  if(slot.kind==="recipe"&&slot.meal)return MEALS[slot.meal].components.map(c=>({ing:c.ing,him:c.him,her:c.her}));
  if(slot.kind==="recipe"&&slot.inline)return slot.inline.components.map(c=>({ing:c.ing,him:c.him,her:c.her}));
  return null;
}
const oneTotals=comps=>{const t=z();for(const c of comps){const x=nutOf(c.ing,c.g);for(const k in t)t[k]+=x[k];}return t;};

// portion a single assembled bowl for one person to a {kcal, p} sub-target
function solveSlot(slot,w,tgt){
  const pr=slot.protein, cb=slot.carb, cb2=slot.carb2||"", vg=slot.veg||"", vg2=slot.veg2||"";
  const fatIng=fatFor(seasonOf(pr)), fatG=1;
  const scale=clamp(tgt.kcal/650,0.55,1.7);                        // veg tracks meal size
  const vgG=vg?capAmt(vg,"veg",baseVeg(vg,w,scale)):0;
  const vg2G=vg2?capAmt(vg2,"veg",roundAmt(vg2,(isUnit(vg2)?1:(w==="him"?90:80))*scale)):0;
  const prG=capAmt(pr,"protein",roundAmt(pr,amtFor(pr,"p",tgt.p)));
  const baseK=nutOf(pr,prG).kcal+(vgG?nutOf(vg,vgG).kcal:0)+(vg2G?nutOf(vg2,vg2G).kcal:0)+nutOf(fatIng,fatG).kcal;
  const needK=Math.max(0,tgt.kcal-baseK);
  let cbG,cb2G=0;
  if(cb2){cbG=capAmt(cb,"carb",roundAmt(cb,amtFor(cb,"kcal",needK*0.6)));cb2G=capAmt(cb2,"carb",roundAmt(cb2,amtFor(cb2,"kcal",needK*0.4)));}
  else cbG=capAmt(cb,"carb",roundAmt(cb,amtFor(cb,"kcal",needK)));
  const comps=[{ing:pr,g:prG},{ing:cb,g:cbG}];
  if(cb2&&cb2G)comps.push({ing:cb2,g:cb2G});
  if(vgG)comps.push({ing:vg,g:vgG});
  if(vg2G)comps.push({ing:vg2,g:vg2G});
  comps.push({ing:fatIng,g:fatG});
  const short=tgt.kcal-oneTotals(comps).kcal;                       // carb clamped out? add density
  if(short>110){const a=clamp(r5(amtFor("avocado","kcal",short)),0,150);if(a)comps.push({ing:"avocado",g:a});}
  return comps;
}
function bowlBothForTarget(slot,tgts){
  const map={};
  for(const w of ["him","her"])for(const c of solveSlot(slot,w,tgts[w])){map[c.ing]=map[c.ing]||{ing:c.ing,him:0,her:0};map[c.ing][w]=c.g;}
  return Object.values(map);
}

// solve every flex slot in a day for one person, balanced across the whole day
function solvePerson(dk,w){
  const day=ST.days[dk],T=ST.targets[w],out={};
  const flex=SLOTS.filter(sk=>isFlex(day.slots[sk]));
  if(!flex.length)return out;
  let base=z();
  for(const sk of SLOTS){const f=slotFixedComps(day.slots[sk]);if(f){const t=compTotals(f,w);for(const k in base)base[k]+=t[k];}}
  const sh=day.shake[w];if(sh){const x=nutOf("koia",sh);for(const k in base)base[k]+=x[k];}
  const wts=flex.map(sk=>SLOT_SHARE[sk]), sw=wts.reduce((a,b)=>a+b,0);
  const remK=T.kcal-base.kcal, remP=T.p-base.p;
  let alloc=flex.map((_,i)=>({kcal:remK*wts[i]/sw,p:remP*wts[i]/sw})), solved=[];
  for(let it=0;it<5;it++){
    solved=flex.map((sk,i)=>solveSlot(day.slots[sk],w,alloc[i]));
    let gK=0,gP=0;for(const c of solved){const t=oneTotals(c);gK+=t.kcal;gP+=t.p;}
    const dK=remK-gK,dP=remP-gP;
    if(Math.abs(dK)<20&&Math.abs(dP)<4)break;
    alloc=alloc.map((a,i)=>({kcal:a.kcal+dK*wts[i]/sw,p:a.p+dP*wts[i]/sw}));
  }
  flex.forEach((sk,i)=>out[sk]=solved[i]);
  return out;
}

function materializeDay(dk){
  const day=ST.days[dk],slotComps={},run={him:z(),her:z()};
  const solved={him:solvePerson(dk,"him"),her:solvePerson(dk,"her")};
  for(const sk of SLOTS){
    const fixed=slotFixedComps(day.slots[sk]);
    if(fixed)slotComps[sk]=fixed;
    else if(isFlex(day.slots[sk])){
      const map={};
      for(const w of ["him","her"])for(const c of (solved[w][sk]||[])){map[c.ing]=map[c.ing]||{ing:c.ing,him:0,her:0};map[c.ing][w]=c.g;}
      slotComps[sk]=Object.values(map);
    } else slotComps[sk]=[];
    for(const w of ["him","her"]){const mt=compTotals(slotComps[sk],w);for(const k in run[w])run[w][k]+=mt[k];}
  }
  for(const w of ["him","her"]){const s=day.shake[w];if(s){const x=nutOf("koia",s);for(const k in run[w])run[w][k]+=x[k];}}
  return {slotComps,totals:run};
}

// ---------- rendering ----------
const opt=(v,l,sel)=>`<option value="${v}"${v===sel?" selected":""}>${l}</option>`;
function bowlSelect(dk,sk,field,pool,cur,allowNone){
  return `<select data-dk="${dk}" data-sk="${sk}" data-bf="${field}">${(allowNone?opt("","— none —",cur):"")+pool.map(id=>opt(id,ING[id].name,cur)).join("")}</select>`;
}
function slotEditor(dk,sk,slotComps){
  const slot=ST.days[dk].slots[sk];
  const curVal=slot.kind==="recipe"?(slot.meal?"r:"+slot.meal:""):slot.kind==="bowl"?"b":"";
  let main=`<select class="main-sel" data-dk="${dk}" data-sk="${sk}" data-main="1">`+opt("","— empty —",curVal);
  main+=`<optgroup label="Recipes">`+recipesForSlot(sk).map(id=>opt("r:"+id,MEALS[id].name,curVal)).join("")+`</optgroup>`;
  if(COMBOS.length)main+=`<optgroup label="Saved combos">`+COMBOS.map((c,i)=>opt("c:"+i,"◆ "+c.name,"")).join("")+`</optgroup>`;
  main+=opt("b","＋ Assemble a bowl…",curVal)+`</select>`;
  let bowl="";
  if(slot.kind==="bowl"){
    bowl=`<div class="bowl">
      <div class="sv"><span>Protein</span>${bowlSelect(dk,sk,"protein",ROLE.protein,slot.protein,false)}</div>
      <div class="sv"><span>Carb</span>${bowlSelect(dk,sk,"carb",ROLE.carb,slot.carb,false)}</div>
      <div class="sv"><span>Carb 2</span>${bowlSelect(dk,sk,"carb2",ROLE.carb,slot.carb2||"",true)}</div>
      <div class="sv"><span>Veg</span>${bowlSelect(dk,sk,"veg",ROLE.veg,slot.veg||"",true)}</div>
      <div class="sv"><span>Veg 2</span>${bowlSelect(dk,sk,"veg2",ROLE.veg,slot.veg2||"",true)}</div>
    </div><div class="combtn"><button data-savecombo="${dk}:${sk}">★ Save combo</button></div>`;
  }
  const comps=slotComps[sk]||[], th=compTotals(comps,"him"), tr=compTotals(comps,"her");
  const mk=comps.length?`<b>${R(th.kcal)}</b>/<i>${R(tr.kcal)}</i> kcal<br><em>${R(th.p)}/${R(tr.p)}g P</em>`:"—";
  return `<div class="slot"><span class="lab">${SLOT_LABEL[sk]}</span><div>${main}${bowl}</div><span class="mk">${mk}</span></div>`;
}
function perBlock(dk,w,tot){
  const T=ST.targets[w], floor=floorOf(w), kOff=Math.abs(tot.kcal-T.kcal)/T.kcal, pOk=tot.p>=floor;
  let chips=`<span class="chip ${pOk?'ok':'bad'}">P ${R(tot.p)}g${pOk?' ✓':' <'+floor}</span>`;
  chips+=`<span class="chip carb">${R(tot.c)}g C · ${R(tot.fib)}g fib</span>`;
  chips+=kOff<=0.08?`<span class="chip ok">on target</span>`:kOff<=0.15?`<span class="chip warn">${R(kOff*100)}% off</span>`:`<span class="chip bad">${R(kOff*100)}% off</span>`;
  return `<div class="per ${w}"><div class="who">${w==='him'?'His':'Hers'}</div>
    <div class="kc">${R(tot.kcal)}<span>/ ${T.kcal} kcal</span></div><div class="row2">${chips}</div></div>`;
}
function dayCard(dk){
  const day=ST.days[dk], {slotComps,totals}=materializeDay(dk);
  return `<section class="day"><div class="dhead"><h2>${day.label}</h2></div>
    <div class="slots">${SLOTS.map(sk=>slotEditor(dk,sk,slotComps)).join("")}
      <div class="shakerow">Koia shake — His <input type="number" min="0" step="1" data-shake="${dk}:him" value="${day.shake.him}"> · Hers <input type="number" min="0" step="1" data-shake="${dk}:her" value="${day.shake.her}"></div></div>
    <div class="summary">${perBlock(dk,'him',totals.him)}${perBlock(dk,'her',totals.her)}</div></section>`;
}
function render(){
  document.getElementById("main").innerHTML=ST.order.map(dayCard).join("");
  document.getElementById("weekId").value=ST.weekId;
  const t=ST.targets;
  document.getElementById("legend").innerHTML=
    `<b>Him</b> ${t.him.kcal.toLocaleString()} kcal · ${t.him.p}g P (floor ${floorOf("him")}) · ${t.him.c}g C · ${t.him.fib}g fib · ${t.him.f}g fat`
    +` &nbsp;·&nbsp; <b>Her</b> ${t.her.kcal.toLocaleString()} kcal · ${t.her.p}g P (floor ${floorOf("her")}). `
    +`Each slot is a saved recipe or an assembled bowl auto-portioned to each split.`;
  wire();
}
function wire(){
  const m=document.getElementById("main");
  m.querySelectorAll("select[data-main]").forEach(s=>s.onchange=e=>{
    const {dk,sk}=e.target.dataset, v=e.target.value;
    if(v==="")ST.days[dk].slots[sk]={kind:"empty"};
    else if(v.startsWith("r:"))ST.days[dk].slots[sk]={kind:"recipe",meal:v.slice(2)};
    else if(v.startsWith("c:")){const c=COMBOS[+v.slice(2)];ST.days[dk].slots[sk]={kind:"bowl",protein:c.protein,carb:c.carb,carb2:c.carb2||"",veg:c.veg||"",veg2:c.veg2||""};}
    else if(v==="b")ST.days[dk].slots[sk]={kind:"bowl",protein:ROLE.protein[0],carb:ROLE.carb[0],carb2:"",veg:ROLE.veg[0],veg2:""};
    render();});
  m.querySelectorAll("select[data-bf]").forEach(s=>s.onchange=e=>{const {dk,sk,bf}=e.target.dataset;ST.days[dk].slots[sk][bf]=e.target.value;render();});
  m.querySelectorAll("input[data-shake]").forEach(i=>i.onchange=e=>{const [dk,w]=e.target.dataset.shake.split(":");ST.days[dk].shake[w]=Math.max(0,parseInt(e.target.value||"0",10));render();});
  m.querySelectorAll("button[data-savecombo]").forEach(b=>b.onclick=()=>{
    const [dk,sk]=b.dataset.savecombo.split(":"), s=ST.days[dk].slots[sk];
    const name=prompt("Name this combo:",`${ING[s.protein].name} · ${ING[s.carb].name}`);if(!name)return;
    COMBOS.push({name,protein:s.protein,carb:s.carb,carb2:s.carb2||"",veg:s.veg||"",veg2:s.veg2||""});render();
    alert("Saved for this session. Use Export → combos to persist it to src/combos.json.");});
}

// ---------- New recipe interface (auto-split) ----------
function newRecipePanel(){
  const p=panel(`<button class="close" data-close>Close</button><h3>Add a recipe to the bank</h3>
    <div class="frm">
      <label>Name<input type="text" id="nrName" placeholder="e.g. Teriyaki beef bowl"></label>
      <label>Slot<select id="nrSlot">${SLOTS.map(s=>opt(s,SLOT_LABEL[s],"lunch")).join("")}</select></label>
      <label>Build<select id="nrMode">${opt("auto","Assemble (auto-split)","auto")+opt("manual","Manual rows","auto")}</select></label>
    </div>
    <div id="nrBody"></div>
    <div style="margin-top:10px"><button class="primary" id="nrSave">Save to bank</button> <button id="nrPreview">Preview split</button></div>
    <div id="nrOut" class="hint"></div>`);
  document.getElementById("nrSlot").value="lunch";
  const body=()=>document.getElementById("nrBody");
  function renderMode(){
    const mode=document.getElementById("nrMode").value;
    if(mode==="auto"){
      body().innerHTML=`<div class="bowl">
        <div class="sv"><span>Protein</span><select id="nrP">${ROLE.protein.map(id=>opt(id,ING[id].name,"")).join("")}</select></div>
        <div class="sv"><span>Carb</span><select id="nrC">${ROLE.carb.map(id=>opt(id,ING[id].name,"")).join("")}</select></div>
        <div class="sv"><span>Carb 2</span><select id="nrC2">${opt("","— none —","")+ROLE.carb.map(id=>opt(id,ING[id].name,"")).join("")}</select></div>
        <div class="sv"><span>Veg</span><select id="nrV">${opt("","— none —","")+ROLE.veg.map(id=>opt(id,ING[id].name,"")).join("")}</select></div>
        <div class="sv"><span>Veg 2</span><select id="nrV2">${opt("","— none —","")+ROLE.veg.map(id=>opt(id,ING[id].name,"")).join("")}</select></div>
      </div><div class="hint">Amounts auto-portion to his &amp; her targets for one ${document.getElementById("nrSlot").value}.</div>`;
      const v=document.getElementById("nrV");if(v)v.value=ROLE.veg[0];
    } else {
      window._nrRows=window._nrRows||[{ing:ROLE.protein[0],him:150,her:100}];
      body().innerHTML=window._nrRows.map((r,i)=>`<div class="rrow">
        <select data-ri="${i}" data-rf="ing">${Object.keys(ING).map(id=>opt(id,ING[id].name,r.ing)).join("")}</select>
        His <input type="number" data-ri="${i}" data-rf="him" value="${r.him}"><span class="g">${ING[r.ing].unit}</span>
        Hers <input type="number" data-ri="${i}" data-rf="her" value="${r.her}"><span class="g">${ING[r.ing].unit}</span>
        <button data-autor="${i}">↺ auto hers</button> <button data-delr="${i}">✕</button></div>`).join("")
        +`<button id="nrAddRow">＋ ingredient</button>`;
      wireManual();
    }
  }
  function wireManual(){
    const b=body();
    b.querySelectorAll("select[data-rf],input[data-rf]").forEach(el=>el.onchange=e=>{
      const i=+e.target.dataset.ri, f=e.target.dataset.rf;
      window._nrRows[i][f]=f==="ing"?e.target.value:Math.max(0,parseFloat(e.target.value||"0"));renderMode();});
    b.querySelectorAll("button[data-autor]").forEach(x=>x.onclick=()=>{const i=+x.dataset.autor,r=window._nrRows[i];r.her=r5(r.him*(SPLIT_RATIO[ING[r.ing].role]??0.65));renderMode();});
    b.querySelectorAll("button[data-delr]").forEach(x=>x.onclick=()=>{window._nrRows.splice(+x.dataset.delr,1);if(!window._nrRows.length)window._nrRows=[{ing:ROLE.protein[0],him:150,her:100}];renderMode();});
    const add=document.getElementById("nrAddRow");if(add)add.onclick=()=>{window._nrRows.push({ing:ROLE.veg[0],him:150,her:140});renderMode();};
  }
  function collect(){
    const mode=document.getElementById("nrMode").value, slot=document.getElementById("nrSlot").value;
    if(mode==="auto"){
      const bs={kind:"bowl",protein:document.getElementById("nrP").value,carb:document.getElementById("nrC").value,carb2:document.getElementById("nrC2").value,veg:document.getElementById("nrV").value,veg2:document.getElementById("nrV2").value};
      const share=SLOT_SHARE[slot];
      const comps=bowlBothForTarget(bs,{him:{kcal:ST.targets.him.kcal*share,p:ST.targets.him.p*share},her:{kcal:ST.targets.her.kcal*share,p:ST.targets.her.p*share}});
      const fam=seasonOf(bs.protein);
      return {slot,comps,tag:"assembled",lpr:lprFor(bs.protein,fam),note:SEASON_NOTE[fam]};
    } else {
      return {slot,comps:window._nrRows.filter(r=>r.him||r.her).map(r=>({ing:r.ing,him:r.him,her:r.her})),tag:"custom",lpr:false,note:""};
    }
  }
  document.getElementById("nrMode").onchange=renderMode;
  document.getElementById("nrSlot").onchange=renderMode;
  document.getElementById("nrPreview").onclick=()=>{
    const {comps}=collect();
    document.getElementById("nrOut").innerHTML="<b>Split preview:</b><br>"+comps.map(c=>`${ING[c.ing].name}: <b>${c.him}</b>${ING[c.ing].unit} / <i>${c.her}</i>${ING[c.ing].unit}`).join(" · ");
  };
  document.getElementById("nrSave").onclick=()=>{
    const name=(document.getElementById("nrName").value||"").trim();if(!name)return alert("Name the recipe first.");
    const {slot,comps,tag,lpr,note}=collect();if(!comps.length)return alert("Add at least one ingredient.");
    let id=slug(name)||("recipe-"+Date.now());if(MEALS[id])id+="-"+Date.now();
    const rec={name,slot,tag,...(lpr?{lpr:true}:{}),...(note?{note}:{}),components:comps};
    MEALS[id]=rec;NEWRECIPES[id]=rec;window._nrRows=null;
    alert(`Added “${name}” to the bank. It's now selectable in ${SLOT_LABEL[slot]} slots. Export → recipes to persist it.`);
    document.getElementById("panel").remove();render();
  };
  renderMode();
  p.querySelector("[data-close]").onclick=()=>p.remove();
}

// ---------- plan checker ----------
function checkPanel(){
  let rows="", wk={him:{kcal:0,p:0,c:0,fib:0,f:0},her:{kcal:0,p:0,c:0,fib:0,f:0}}, allok=true;
  for(const dk of ST.order){
    const {totals}=materializeDay(dk);
    for(const w of ["him","her"]){
      const t=totals[w],T=ST.targets[w],floor=floorOf(w),kOff=Math.abs(t.kcal-T.kcal)/T.kcal;
      const pOk=t.p>=floor, kOk=kOff<=0.15, ok=pOk&&kOk;if(!ok)allok=false;
      for(const k in wk[w])wk[w][k]+=t[k];
      rows+=`<tr><td>${ST.days[dk].label}</td><td>${w==='him'?'His':'Hers'}</td>
        <td class="n">${R(t.kcal)} / ${T.kcal}</td><td class="n">${R(t.p)} / ${floor}</td>
        <td class="n">${R(t.c)}</td><td class="n">${R(t.fib)}</td>
        <td><span class="chip ${ok?'ok':(pOk?'warn':'bad')}">${ok?'ok':(pOk?R(kOff*100)+'% kcal':'P low')}</span></td></tr>`;
    }
  }
  const n=ST.order.length;
  const avg=w=>`His/Hers avg — ${w==='him'?'His':'Hers'}: <b>${R(wk[w].kcal/n)}</b> kcal · <b>${R(wk[w].p/n)}</b>g P · <b>${R(wk[w].c/n)}</b>g C · <b>${R(wk[w].fib/n)}</b>g fib`;
  panel(`<button class="close" data-close>Close</button><h3>Plan check — ${allok?'✓ all days meet goals':'⚠ some days off'}</h3>
    <table class="tb"><thead><tr><th>Day</th><th></th><th>kcal</th><th>Protein</th><th>Carb</th><th>Fiber</th><th></th></tr></thead><tbody>${rows}</tbody></table>
    <div class="hint">${avg('him')}<br>${avg('her')}<br>Pass = protein ≥ floor and calories within 15% of target.</div>`)
    .querySelector("[data-close]").onclick=e=>e.target.closest(".panel").remove();
}

// ---------- grocery (with visible assumptions) ----------
function computeGrocery(){
  const cooked={},count={};
  for(const dk of ST.order){
    const {slotComps}=materializeDay(dk);
    for(const sk of SLOTS)for(const cp of slotComps[sk]){const amt=(cp.him||0)+(cp.her||0);if(!amt)continue;
      if(ING[cp.ing].basis==="unit")count[cp.ing]=(count[cp.ing]||0)+amt;else cooked[cp.ing]=(cooked[cp.ing]||0)+amt;}
    const sh=ST.days[dk].shake;count["koia"]=(count["koia"]||0)+(sh.him||0)+(sh.her||0);
  }
  const groups={},staples=[];
  for(const ing of Object.keys({...cooked,...count}).sort()){
    const g=ING[ing].grocery;if(g.is_staple){staples.push(ING[ing].name);continue;}
    const gk=g.purchase_group||ing, grp=groups[gk]||(groups[gk]={base:0,count:0,g,label:ING[ing].name});
    if(ING[ing].basis==="unit")grp.count+=count[ing]||0;else grp.base+=(cooked[ing]||0)/g.yield;
  }
  const ceilPack=(x,p)=>Math.ceil(x/p-TOL)*p, rows=[];
  for(const gk of Object.keys(groups)){
    const grp=groups[gk],g=grp.g,pu=g.purchase_unit,pack=g.pack_size,ug=g.unit_grams;let x,asm;
    if(pu==="lb"){x=grp.base/LB;asm=`${R(grp.base*g.yield)}g cooked ÷ ${g.yield} = ${R(grp.base)}g raw ÷ 454`;}
    else if(pu==="cup_dry"){x=grp.base/ug;asm=`${R(grp.base*g.yield)}g ÷ ${g.yield} = ${R(grp.base)}g dry ÷ ${ug}/cup`;}
    else if(pu==="dozen"){x=grp.count/12;asm=`${grp.count} eggs ÷ 12`;}
    else if(pu==="bottle"){x=grp.count;asm=`${grp.count} counted`;}
    else{x=grp.base/ug;asm=`${R(grp.base*g.yield)}g ÷ ${g.yield} = ${R(grp.base)}g ÷ ${ug}g/${pu}`;}
    let qty=ceilPack(x,pack);if(qty===Math.floor(qty))qty=Math.round(qty);
    rows.push({name:GROUP_LABEL[gk]||grp.label,buy:pu==="each"?`${qty}`:`${qty} ${UNIT_WORD[pu]}`.trim(),asm:asm+` → ↑ pack ${pack}`});
  }
  rows.sort((a,b)=>a.name.localeCompare(b.name));return {rows,staples};
}
// The week's deliverable: the full grocery list + the full meal plan.
function groceryPanel(){
  const {rows,staples}=computeGrocery();
  let planHTML="", planTXT="";
  for(const dk of ST.order){
    const day=ST.days[dk], {slotComps,totals}=materializeDay(dk);
    planHTML+=`<tr><td colspan="3" style="padding-top:12px"><b>${day.label}</b> <span class="asm">· his ${R(totals.him.kcal)} kcal / ${R(totals.him.p)}g P · hers ${R(totals.her.kcal)} / ${R(totals.her.p)}g P</span></td></tr>`;
    planTXT+=`\n${day.label.toUpperCase()}  (his ${R(totals.him.kcal)} kcal/${R(totals.him.p)}g P · hers ${R(totals.her.kcal)}/${R(totals.her.p)}g P)\n`;
    for(const sk of SLOTS){
      const comps=slotComps[sk]; if(!comps.length) continue;
      const slot=day.slots[sk];
      const nm=slot.kind==="recipe"&&slot.meal?MEALS[slot.meal].name:slot.kind==="recipe"&&slot.inline?slot.inline.name:`${ING[slot.protein].name} · ${ING[slot.carb].name} bowl`;
      const items=comps.filter(c=>c.him||c.her).map(c=>`${ING[c.ing].name} ${c.him||0}${ING[c.ing].unit}/${c.her||0}${ING[c.ing].unit}`);
      planHTML+=`<tr><td style="padding-left:14px">${SLOT_LABEL[sk]}</td><td><b>${nm}</b></td><td class="asm">${items.join(" · ")}</td></tr>`;
      planTXT+=`  ${SLOT_LABEL[sk]}: ${nm}\n    ${items.join(", ")}\n`;
    }
    const sh=day.shake; if(sh.him||sh.her){planHTML+=`<tr><td style="padding-left:14px">Shake</td><td>Koia Elite</td><td class="asm">${sh.him}/${sh.her} bottle</td></tr>`;planTXT+=`  Shake: Koia Elite ${sh.him}/${sh.her}\n`;}
  }
  const groTXT=rows.map(r=>`  ${r.name} — ${r.buy}`).join("\n")+`\n  Staples (buy when low): ${staples.join(", ")}`;
  panel(`<button class="close" data-close>Close</button><h3>Week output — grocery list + meal plan</h3>
    <h3 style="margin-top:10px;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)">Groceries to buy</h3>
    <table class="tb"><thead><tr><th>Item</th><th>Buy</th><th>Derived from</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${r.name}</td><td class="buy">${r.buy}</td><td class="asm">${r.asm}</td></tr>`).join("")}</tbody></table>
    <div class="hint">Staples (buy when low): ${staples.join(", ")}. Amounts round <b>up</b> to real pack sizes — this is the complete list, not netted against what's already in the fridge.</div>
    <h3 style="margin-top:16px;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)">Meal plan · amounts are his/hers</h3>
    <table class="tb"><tbody>${planHTML}</tbody></table>
    <h3 style="margin-top:16px;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)">Copy as text</h3>
    <textarea readonly id="planTxt">GROCERY LIST — ${ST.weekId}\n${groTXT}\n\nMEAL PLAN${planTXT}</textarea>
    <div class="hint"><button id="copyPlan">Copy to clipboard</button></div>`)
    .querySelector("[data-close]").onclick=e=>e.target.closest(".panel").remove();
  document.getElementById("copyPlan").onclick=()=>{const t=document.getElementById("planTxt");t.select();document.execCommand("copy");};
}

// ---------- exports ----------
function buildWeekJson(){
  const days={};
  for(const dk of ST.order){
    const day=ST.days[dk], {slotComps}=materializeDay(dk), slots={};
    for(const sk of SLOTS){
      const slot=day.slots[sk];
      if(slot.kind==="recipe"&&slot.meal)slots[sk]=slot.meal;
      else if(slot.kind==="recipe"&&slot.inline)slots[sk]=slot.inline;
      else if(slot.kind==="bowl"&&slot.protein){const fam=seasonOf(slot.protein);
        slots[sk]={name:`${ING[slot.protein].name} · ${ING[slot.carb].name} bowl`,tag:"assembled",...(lprFor(slot.protein,fam)?{lpr:true}:{}),note:SEASON_NOTE[fam],components:slotComps[sk]};}
    }
    days[dk]={label:day.label,sub:day.sub,slots,shake:{him:day.shake.him,her:day.shake.her}};
  }
  return {weekId:document.getElementById("weekId").value.trim()||ST.weekId,weekOrder:ST.order,targets:ST.targets,days};
}
function exportPanel(){
  const wk=JSON.stringify(buildWeekJson(),null,2);
  const rc=Object.keys(NEWRECIPES).length?JSON.stringify(NEWRECIPES,null,2).replace(/^\{\n|\n\}$/g,""):"(no new recipes this session)";
  const cm=JSON.stringify({_comment:"Saved combos.",combos:COMBOS},null,2);
  panel(`<button class="close" data-close>Close</button><h3>Export</h3>
    <div class="hint">Save block 1 as <code>src/week.json</code>. Paste block 2 into <code>src/meals.json</code>. Then <code>python build/build.py &amp;&amp; python build/grocery.py &amp;&amp; python build/validate.py</code> and push.</div>
    <h3 style="margin-top:12px">src/week.json</h3><textarea readonly>${wk.replace(/</g,"&lt;")}</textarea>
    <h3 style="margin-top:12px">new recipes → src/meals.json</h3><textarea readonly>${rc.replace(/</g,"&lt;")}</textarea>
    <h3 style="margin-top:12px">src/combos.json</h3><textarea readonly>${cm.replace(/</g,"&lt;")}</textarea>`)
    .querySelector("[data-close]").onclick=e=>e.target.closest(".panel").remove();
  const blob=new Blob([wk],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="week.json";a.click();
}
function panel(html){let p=document.getElementById("panel");if(!p){p=document.createElement("div");p.id="panel";p.className="panel";document.querySelector(".wrap").appendChild(p);}p.innerHTML=html;p.scrollIntoView({behavior:"smooth",block:"start"});return p;}

const NL=String.fromCharCode(10);
function srcFiles(){
  const f={"src/week.json":JSON.stringify(buildWeekJson(),null,2)+NL,
           "src/combos.json":JSON.stringify({_comment:"Saved combos - managed in the builder.",combos:COMBOS},null,2)+NL};
  if(Object.keys(NEWRECIPES).length){
    const out={_comment:MEALS._comment,...Object.fromEntries(Object.keys(MEALS).filter(k=>!k.startsWith("_")).map(k=>[k,MEALS[k]]))};
    f["src/meals.json"]=JSON.stringify(out,null,2)+NL;
  }
  return f;
}
function boot(){
  Promise.all([
    fetch("./src/ingredients.json").then(r=>r.json()),
    fetch("./src/meals.json").then(r=>r.json()),
    fetch("./src/week.json").then(r=>r.json()),
    fetch("./src/combos.json").then(r=>r.ok?r.json():{combos:[]}).catch(()=>({combos:[]}))
  ]).then(([i,me,wk,cb])=>{
    ING={};for(const k in i)if(!k.startsWith("_"))ING[k]=i[k];
    for(const k in ING){const r=ING[k].role;if(ROLE[r])ROLE[r].push(k);}
    MEALS=me;WEEK=wk;COMBOS=(cb&&cb.combos)?cb.combos:[];seed();render();
    document.getElementById("newRecipeBtn").onclick=newRecipePanel;
    document.getElementById("checkBtn").onclick=checkPanel;
    document.getElementById("groceryBtn").onclick=groceryPanel;
    document.getElementById("exportBtn").onclick=exportPanel;
    GH.mount(document.getElementById("ghMount"),()=>srcFiles(),
      {label:"Save week to GitHub",message:"Update week plan from the builder"});
    document.getElementById("reset").onclick=()=>{seed();const p=document.getElementById("panel");if(p)p.remove();render();};
  }).catch(e=>{document.getElementById("main").innerHTML=`<div class="state">Couldn't load sources — serve over HTTP so <code>./src/*.json</code> is reachable.<br><br>(${String(e.message||e)})</div>`;});
}
boot();
</script>
